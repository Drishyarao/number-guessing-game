<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        .difficulty {
            margin-bottom: 20px;
        }

        .difficulty label {
            margin-right: 15px;
            cursor: pointer;
        }

        .difficulty input[type="radio"] {
            margin-right: 5px;
        }

        .game-content {
            margin: 30px 0;
        }

        .info {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .info p {
            color: #666;
            margin: 5px 0;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #667eea;
            border-radius: 5px;
            font-size: 16px;
        }

        button {
            background: #667eea;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 5px;
            transition: 0.3s;
        }

        button:hover {
            background: #764ba2;
        }

        .message {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            min-height: 30px;
        }

        .correct {
            color: #28a745;
        }

        .wrong {
            color: #dc3545;
        }

        .hint {
            color: #ffc107;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Number Guessing Game</h1>
        
        <div class="difficulty">
            <label>
                <input type="radio" name="difficulty" value="easy" checked> Easy (1-50)
            </label>
            <label>
                <input type="radio" name="difficulty" value="medium"> Medium (1-100)
            </label>
            <label>
                <input type="radio" name="difficulty" value="hard"> Hard (1-200)
            </label>
        </div>

        <button onclick="startGame()">Start New Game</button>

        <div id="gameArea" class="game-content hidden">
            <div class="info">
                <p id="rangeText">Guess a number between 1 and 100</p>
                <p>Attempts: <span id="attempts">0</span></p>
            </div>

            <input 
                type="number" 
                id="guessInput" 
                placeholder="Enter your guess"
            >

            <button onclick="checkGuess()">Check Guess</button>
            <button onclick="resetGame()">New Game</button>

            <div id="message" class="message"></div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
